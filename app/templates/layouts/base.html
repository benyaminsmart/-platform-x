<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ 'rtl' if lang in ['ar'] else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ tenant.name if tenant else 'Platform-X' }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ tenant.config.tagline if tenant and tenant.config and tenant.config.tagline else 'Multi-tenant smart platform' }}{% endblock %}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (for rapid iteration; core styles live in /static/css) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            'x-bg': '#08090b',
            'x-surface': '#101216',
            'x-gold': '#c9a66b',
            'x-cream': '#f4efe6',
          }
        }
      }
    };
  </script>

  <!-- Platform-X CSS -->
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/typography.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">

  {% block head %}{% endblock %}
</head>
<body>

  {% include "partials/header.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="/static/js/px-core.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
