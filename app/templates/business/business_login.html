{% extends "business/business_base.html" %}

{% block title %}Business Sign in — Platform-X{% endblock %}

{% block auth_content %}
<div class="admin-auth-card">
  <div class="admin-auth-logo">
    <div class="admin-logo-mark">X</div>
    <div class="admin-logo" style="font-size: 16px;">Business Panel</div>
  </div>

  <h1 class="admin-auth-title">Sign in</h1>
  <p class="admin-auth-sub">For registered business owners and staff only.</p>

  <div id="admin-alert" class="admin-alert admin-alert-error" style="display: none;"></div>

  <form id="business-login-form">
    <div class="admin-field">
      <label class="admin-label" for="email">Email</label>
      <input class="admin-input" type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="admin-field">
      <label class="admin-label" for="password">Password</label>
      <input class="admin-input" type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="admin-btn admin-btn-block">Sign in</button>
  </form>

  <p style="font-size: 12px; color: var(--adm-muted); text-align: center; margin-top: 16px;">
    Guest? <a href="/login" style="color: var(--adm-brand);">Sign in here</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  var form = document.getElementById("business-login-form");
  var alertBox = document.getElementById("admin-alert");
  if (!form) return;
  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    alertBox.style.display = "none";
    var email = form.email.value.trim();
    var password = form.password.value;
    try {
      // Tenant from URL (?tenant=xxx) or default
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("tenant") || "trianon-hotel";

      var res = await fetch("/business/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Tenant-Slug": slug,
        },
        body: JSON.stringify({email: email, password: password}),
      });
      var data = await res.json();
      if (!res.ok) {
        alertBox.textContent = data.detail || "Login failed";
        alertBox.style.display = "block";
        return;
      }
      try { localStorage.setItem("px_business_token", data.access_token); } catch(e){}
      window.location.href = "/business/dashboard";
    } catch(err) {
      alertBox.textContent = "Network error";
      alertBox.style.display = "block";
    }
  });
})();
</script>
{% endblock %}
