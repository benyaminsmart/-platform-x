{% extends "business/business_base.html" %}
{% block title %}Messages — Business Panel{% endblock %}

{% block content %}
<div class="admin-card" style="margin-bottom: 24px;">
  <h2>Messages</h2>
  <p class="admin-card-sub" style="margin-bottom: 0;">
    Conversations with guests, one thread per booking.
  </p>
</div>

<div class="msg-layout">
  <div class="admin-card msg-list">
    <div class="coach-head">
      <h3>Threads</h3>
      <button type="button" class="admin-btn" id="msg-refresh" style="background:var(--adm-surface-2); color:var(--adm-text);">Refresh</button>
    </div>
    <div id="msg-threads"><div class="msg-loading">Loading…</div></div>
  </div>
  <div class="admin-card msg-panel">
    <div id="msg-head" class="msg-head">Select a thread</div>
    <div id="msg-body" class="msg-body"></div>
    <form id="msg-form" class="msg-form" style="display:none;">
      <input type="text" id="msg-input" placeholder="Type your reply..." autocomplete="off" maxlength="4000">
      <button type="button" id="msg-ai-draft" class="admin-btn" style="background:var(--adm-surface-2); color:var(--adm-text);">✨ AI Draft</button>
      <button type="submit" class="admin-btn">Send</button>
    </form>
  </div>
</div>

<style>
.msg-layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
@media (max-width: 900px) { .msg-layout { grid-template-columns: 1fr; } }
.msg-list { max-height: 640px; overflow-y: auto; }
.msg-loading { color: var(--adm-muted); font-size: 13px; margin-top: 10px; }
.msg-thread {
  padding: 10px 12px; border: 1px solid var(--adm-line); border-radius: 10px;
  background: var(--adm-surface-2); cursor: pointer; margin-bottom: 6px;
}
.msg-thread:hover { border-color: var(--adm-brand); }
.msg-thread.active { border-color: var(--adm-brand); background: var(--adm-surface); }
.msg-thread .tt { font-weight: 600; color: var(--adm-text); font-size: 14px; }
.msg-thread .tm { font-size: 12px; color: var(--adm-muted); margin-top: 4px; display: flex; justify-content: space-between; }
.msg-thread .unread {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  background: var(--adm-brand); color: #fff; font-size: 11px; font-weight: 700;
}
.msg-panel { display: flex; flex-direction: column; min-height: 500px; max-height: 640px; }
.msg-head { padding-bottom: 10px; border-bottom: 1px solid var(--adm-line); font-family: var(--adm-font-display); font-weight: 700; color: var(--adm-text); }
.msg-body { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 13.5px; line-height: 1.5; }
.msg-bubble.user { background: var(--adm-surface-2); color: var(--adm-text); align-self: flex-start; border: 1px solid var(--adm-line); }
.msg-bubble.business { background: var(--adm-brand); color: #fff; align-self: flex-end; }
.msg-form { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--adm-line); }
.msg-form input {
  flex: 1; padding: 10px 12px; border: 1px solid var(--adm-line-2); border-radius: 8px;
  background: var(--adm-surface-2); color: var(--adm-text); font-family: inherit; font-size: 14px; outline: none;
}
</style>
{% endblock %}

{% block scripts %}
<script>
(function(){
  var token = null;
  try { token = localStorage.getItem("px_business_token"); } catch(e){}
  if (!token) { window.location.href = "/business/login"; return; }
  var slug = null;
  var currentThread = null;

  function h() { return { "Authorization": "Bearer " + token, "X-Tenant-Slug": slug, "Content-Type": "application/json" }; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  async function resolveSlug() {
    var res = await fetch("/business/api/me", { headers: { "Authorization": "Bearer " + token } });
    if (!res.ok) { window.location.href = "/business/login"; return; }
    slug = (await res.json()).tenant_slug;
  }

  async function loadThreads() {
    var wrap = document.getElementById("msg-threads");
    wrap.innerHTML = '<div class="msg-loading">Loading…</div>';
    var res = await fetch("/business/api/messages/threads", { headers: h() });
    if (!res.ok) { wrap.innerHTML = '<div class="msg-loading">Failed.</div>'; return; }
    var list = await res.json();
    if (!list.length) { wrap.innerHTML = '<div class="msg-loading">No conversations yet.</div>'; return; }
    wrap.innerHTML = list.map(function(t){
      var cls = (t.thread_id === currentThread ? "active" : "");
      var unread = t.unread ? '<span class="unread">' + t.unread + '</span>' : '';
      return '<div class="msg-thread ' + cls + '" data-tid="' + esc(t.thread_id) + '">' +
        '<div class="tt">' + esc(t.service_name) + '</div>' +
        '<div class="tm"><span>' + esc(t.check_in) + '</span>' + unread + '</div>' +
      '</div>';
    }).join("");
    wrap.querySelectorAll(".msg-thread").forEach(function(el){
      el.addEventListener("click", function(){ openThread(el.getAttribute("data-tid")); });
    });
  }

  async function openThread(tid) {
    currentThread = tid;
    document.getElementById("msg-form").style.display = "flex";
    document.getElementById("msg-head").textContent = "Conversation";
    var body = document.getElementById("msg-body");
    body.innerHTML = '<div class="msg-loading">Loading…</div>';
    var res = await fetch("/business/api/messages/" + encodeURIComponent(tid), { headers: h() });
    if (!res.ok) { body.innerHTML = '<div class="msg-loading">Failed.</div>'; return; }
    var list = await res.json();
    body.innerHTML = list.map(function(m){
      var role = m.sender_role === "user" ? "user" : "business";
      return '<div class="msg-bubble ' + role + '">' + esc(m.body) + '</div>';
    }).join("");
    body.scrollTop = body.scrollHeight;
    loadThreads();
  }

  document.getElementById("msg-form").addEventListener("submit", async function(ev){
    ev.preventDefault();
    if (!currentThread) return;
    var inp = document.getElementById("msg-input");
    var msg = inp.value.trim();
    if (!msg) return;
    inp.value = "";
    var res = await fetch("/business/api/messages/" + encodeURIComponent(currentThread), {
      method: "POST", headers: h(), body: JSON.stringify({ body: msg }),
    });
    if (res.ok) openThread(currentThread);
  });

  document.getElementById("msg-refresh").addEventListener("click", loadThreads);

  // ---------- AI Receptionist draft (Phase 53, Step 3) ----------
  var aiDraftBtn = document.getElementById("msg-ai-draft");
  if (aiDraftBtn) {
    aiDraftBtn.addEventListener("click", async function(){
      if (!currentThread) { alert("Open a thread first."); return; }
      var inp = document.getElementById("msg-input");
      var original = inp.value;
      aiDraftBtn.disabled = true;
      aiDraftBtn.textContent = "Drafting…";
      inp.value = "";
      try {
        var res = await fetch("/business/api/messages/" + encodeURIComponent(currentThread) + "/draft", {
          method: "POST", headers: h(),
          body: JSON.stringify({ language: "en", tone: "professional" }),
        });
        if (!res.ok) {
          var err = await res.json().catch(function(){ return { detail: "Draft failed" }; });
          inp.value = original;
          alert(err.detail || "Could not draft a reply.");
          return;
        }
        var d = await res.json();
        if (d.status !== "ok" || !d.reply) {
          inp.value = original;
          alert("No draft available for this thread.");
          return;
        }
        inp.value = d.reply;
        inp.focus();
      } catch(e) {
        inp.value = original;
        alert("Network error.");
      } finally {
        aiDraftBtn.disabled = false;
        aiDraftBtn.textContent = "✨ AI Draft";
      }
    });
  }

  (async function(){
    await resolveSlug();
    if (!slug) return;
    loadThreads();
  })();
})();
</script>
{% endblock %}
