<header class="px-header">
  <div class="px-container px-header-inner">
    <a href="/" class="px-logo" aria-label="Platform-X home">
      <span class="px-logo-mark" aria-hidden="true">X</span>
      <span>Platform-X</span>
    </a>

    <nav class="px-nav" id="px-nav" role="navigation" aria-label="Main">
      <a href="/hotels">Hotels</a>
      <a href="/restaurants">Restaurants</a>
      <a href="/travel">Travel</a>
      <a href="/entertainment">Entertainment</a>
    </nav>

    <div class="px-header-right">
      <span id="px-auth-slot" class="px-auth-slot">
        <a href="/login" class="px-btn px-btn-ghost px-hide-mobile">Sign in</a>
        <a href="/register" class="px-btn px-btn-primary">Get started</a>
      </span>

      <button class="px-mobile-toggle" id="px-mobile-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<script>
(function () {
  var toggle = document.getElementById("px-mobile-toggle");
  var nav = document.getElementById("px-nav");
  if (!toggle || !nav) return;
  toggle.addEventListener("click", function () {
    var open = nav.classList.toggle("is-open");
    toggle.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
})();
</script>
