<header class="px-header">
  <div class="px-container px-header-inner">
    <a href="/" class="px-logo" aria-label="Platform-X home">
      <span class="px-logo-mark" aria-hidden="true">X</span>
      <span>Platform-X</span>
    </a>

    <nav class="px-nav" id="px-nav" role="navigation" aria-label="Main">
      <a href="/hotels">{{ t('nav.hotels', current_lang) }}</a>
      <a href="/restaurants">{{ t('nav.restaurants', current_lang) }}</a>
      <a href="/travel">{{ t('nav.travel', current_lang) }}</a>
      <a href="/entertainment">{{ t('nav.entertainment', current_lang) }}</a>
    </nav>

    <div class="px-header-right">
      <div class="px-lang-switcher" id="px-lang-switcher">
        <button class="px-lang-btn" id="px-lang-toggle" aria-haspopup="true" aria-expanded="false" title="Change language">
          <span class="px-lang-globe">🌍</span>
        </button>
        <div class="px-lang-menu" id="px-lang-menu">
          <a href="?lang=en" class="px-lang-option" data-lang="en">
            <span class="px-lang-flag">🇬🇧</span>
            <span>English</span>
          </a>
          <a href="?lang=ar" class="px-lang-option" data-lang="ar">
            <span class="px-lang-flag">🇦🇪</span>
            <span>العربية</span>
          </a>
          <a href="?lang=fil" class="px-lang-option" data-lang="fil">
            <span class="px-lang-flag">🇵🇭</span>
            <span>Filipino</span>
          </a>
          <a href="?lang=hi" class="px-lang-option" data-lang="hi">
            <span class="px-lang-flag">🇮🇳</span>
            <span>हिन्दी</span>
          </a>
        </div>
      </div>

      <span id="px-auth-slot" class="px-auth-slot">
        <a href="/login" class="px-btn px-btn-ghost px-hide-mobile">{{ t('nav.sign_in', current_lang) }}</a>
        <a href="/register" class="px-btn px-btn-primary">{{ t('nav.get_started', current_lang) }}</a>
      </span>

      <button class="px-mobile-toggle" id="px-mobile-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<script>
(function () {
  var toggle = document.getElementById("px-mobile-toggle");
  var nav = document.getElementById("px-nav");
  if (!toggle || !nav) return;
  toggle.addEventListener("click", function () {
    var open = nav.classList.toggle("is-open");
    toggle.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
})();
</script>
