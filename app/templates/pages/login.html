{% extends "layouts/platform_base.html" %}

{% block title %}Sign in — Platform-X{% endblock %}

{% block content %}

<section class="px-auth">
  <div class="px-auth-card">
    <div class="px-auth-head">
      <h1>Welcome back</h1>
      <p>Sign in to continue</p>
    </div>

    <div id="alert-box" style="display: none;"></div>

    <form id="login-form" class="px-auth-form">
      <div class="px-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="px-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" class="px-btn px-btn-primary px-btn-block px-btn-lg">
        Sign in
      </button>
    </form>

    <div class="px-auth-foot">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>PX.initLogin();</script>
{% endblock %}
