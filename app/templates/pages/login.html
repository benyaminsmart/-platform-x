{% extends "layouts/base.html" %}

{% block title %}Login — Platform-X{% endblock %}

{% block content %}

<section class="section-sm">
  <div class="container-narrow" style="max-width: 480px;">
    <div class="text-center" style="margin-bottom: var(--space-7);">
      <div class="eyebrow">Welcome back</div>
      <h1>Sign in</h1>
    </div>

    <div class="card">
      <div id="alert-box" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign in
        </button>
      </form>

      <hr class="divider">

      <p class="text-center text-sm text-muted">
        Don't have an account? <a href="/register">Create one</a>
      </p>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>PX.initLogin();</script>
{% endblock %}
