{% extends "layouts/platform_base.html" %}

{% block title %}Forgot password — Platform-X{% endblock %}

{% block content %}
<section class="px-auth">
  <div class="px-auth-card">
    <div class="px-auth-head">
      <h1>Forgot password?</h1>
      <p>We'll send you a link to reset it.</p>
    </div>

    <div id="alert-box" style="display: none;"></div>

    <form id="forgot-form" class="px-auth-form">
      <div class="px-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>

      <button type="submit" class="px-btn px-btn-primary px-btn-block px-btn-lg">
        Send reset link
      </button>
    </form>

    <div class="px-auth-foot">
      Remember your password? <a href="/login">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function(){
  var form = document.getElementById("forgot-form");
  if (!form) return;
  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var email = form.email.value.trim();
    try {
      var res = await fetch("/auth/forgot-password", {
        method: "POST",
        headers: PX.apiHeaders(),
        body: JSON.stringify({email: email}),
      });
      var data = await res.json();
      var box = document.getElementById("alert-box");
      box.className = "alert alert-success";
      box.textContent = data.message || "Check your email.";
      box.style.display = "block";
      box.style.padding = "12px 16px";
      box.style.borderRadius = "var(--px-radius)";
      box.style.background = "var(--px-success-soft)";
      box.style.color = "var(--px-success)";
      box.style.border = "1px solid rgba(56, 161, 105, 0.3)";
      box.style.marginBottom = "20px";
      form.reset();
    } catch (e) {
      PX.showAlert("Network error. Try again.");
    }
  });
})();
</script>
{% endblock %}
