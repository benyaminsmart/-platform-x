{% extends "layouts/platform_base.html" %}

{% block title %}Create account — Platform-X{% endblock %}

{% block content %}

<section class="px-auth">
  <div class="px-auth-card">
    <div class="px-auth-head">
      <h1>Create account</h1>
      <p>Join Platform-X in seconds</p>
    </div>

    <div id="alert-box" style="display: none;"></div>

    <form id="register-form" class="px-auth-form">
      <div class="px-field-row">
        <div class="px-field">
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="px-field">
          <label for="last_name">Last name</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
      </div>

      <div class="px-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="px-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </div>

      <button type="submit" class="px-btn px-btn-primary px-btn-block px-btn-lg">
        Create account
      </button>
    </form>

    <div class="px-auth-foot">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>PX.initRegister();</script>
{% endblock %}
