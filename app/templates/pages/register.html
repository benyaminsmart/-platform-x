{% extends "layouts/base.html" %}

{% block title %}Create Account — Platform-X{% endblock %}

{% block content %}

<section class="section-sm">
  <div class="container-narrow" style="max-width: 520px;">
    <div class="text-center" style="margin-bottom: var(--space-7);">
      <div class="eyebrow">Get started</div>
      <h1>Create account</h1>
    </div>

    <div class="card">
      <div id="alert-box" style="display: none;"></div>

      <form id="register-form">
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label" for="first_name">First name</label>
            <input class="form-input" type="text" id="first_name" name="first_name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">Last name</label>
            <input class="form-input" type="text" id="last_name" name="last_name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 8 chars, letter + number)</label>
          <input class="form-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Create account
        </button>
      </form>

      <hr class="divider">

      <p class="text-center text-sm text-muted">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>PX.initRegister();</script>
{% endblock %}
