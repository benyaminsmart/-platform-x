{% extends "layouts/platform_base.html" %}

{% block title %}Reset password — Platform-X{% endblock %}

{% block content %}
<section class="px-auth">
  <div class="px-auth-card">
    <div class="px-auth-head">
      <h1>Reset password</h1>
      <p>Enter your new password.</p>
    </div>

    <div id="alert-box" style="display: none;"></div>

    <form id="reset-form" class="px-auth-form">
      <div class="px-field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>

      <div class="px-field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>

      <button type="submit" class="px-btn px-btn-primary px-btn-block px-btn-lg">
        Update password
      </button>
    </form>

    <div class="px-auth-foot">
      <a href="/login">Back to sign in</a>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function(){
  var form = document.getElementById("reset-form");
  if (!form) return;
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");
  if (!token) {
    PX.showAlert("Missing reset token.");
  }
  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var password = form.password.value;
    var confirm = form.confirm_password.value;
    if (password !== confirm) {
      PX.showAlert("Passwords do not match.");
      return;
    }
    try {
      var res = await fetch("/auth/reset-password", {
        method: "POST",
        headers: PX.apiHeaders(),
        body: JSON.stringify({token: token, new_password: password}),
      });
      var data = await res.json();
      if (!res.ok) {
        PX.showAlert(data.detail || "Reset failed");
        return;
      }
      window.location.href = "/login?reset=ok";
    } catch (e) {
      PX.showAlert("Network error.");
    }
  });
})();
</script>
{% endblock %}
