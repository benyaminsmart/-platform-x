{% extends "admin/admin_base.html" %}

{% block title %}Applications — Platform-X Admin{% endblock %}

{% block content %}

<div class="admin-card">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 4px;">
    <div>
      <h2>Partner applications</h2>
      <p class="admin-card-sub" style="margin-bottom: 0;">Businesses that applied to join Platform-X.</p>
    </div>
    <div>
      <select class="admin-input" id="filter-status" style="width: auto;">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="reviewed">Reviewed</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
  </div>

  <div style="overflow-x: auto;">
    <table class="admin-table" style="margin-top: 20px;">
      <thead>
        <tr>
          <th>Business</th>
          <th>Type</th>
          <th>Contact</th>
          <th>City</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="apps-tbody">
        <tr><td colspan="6" style="text-align: center; color: var(--adm-muted); padding: 40px;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/admin.js"></script>
<script>PX.initAdminApplications();</script>
{% endblock %}
