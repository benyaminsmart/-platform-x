<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Platform-X — Document{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/docs/docs.css?v={{ asset_version }}">

  {% block head %}{% endblock %}
</head>
<body>

  <div class="print-hint no-print" onclick="window.print()">
    🖨️ Click to Print / Save as PDF
  </div>

  <div class="doc">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
