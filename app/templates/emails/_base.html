<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ec;font-family:'Inter',Arial,sans-serif;color:#0a1628;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(10,22,40,0.08);">
          <!-- HEADER -->
          <tr>
            <td style="background:linear-gradient(135deg,#0f3d5c 0%,#082a42 100%);padding:32px;text-align:center;">
              <div style="font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.02em;">
                Platform-X
              </div>
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:40px 40px 24px 40px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding:24px 40px 32px 40px;border-top:1px solid #e8e4dd;">
              <p style="font-size:12px;color:#8896a8;margin:0;text-align:center;line-height:1.6;">
                &copy; {{ year }} Platform-X. All rights reserved.<br>
                This is an automated message — please do not reply.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
